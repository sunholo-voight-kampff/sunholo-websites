<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern artisanal bakery specializing in bespoke celebration cakes and architectural confectionery.">
    <title>Gallery | Lumière Pâtisserie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A1A1A;
            --secondary: #F5F5F5;
            --accent: #D4AF37;
            --background: #FFFFFF;
            --text: #2D2D2D;
            --heading-font: 'Playfair Display', serif;
            --body-font: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            font-family: var(--body-font);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: var(--heading-font);
            font-weight: 400;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: color 0.3s ease;
        }

        /* --- Navigation --- */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--background);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 1rem 5%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: var(--heading-font);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a.active {
            border-bottom: 1px solid var(--accent);
        }

        /* Mobile Nav Toggle */
        .menu-toggle {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 6px;
        }

        .menu-toggle span {
            width: 25px;
            height: 1px;
            background-color: var(--primary);
        }

        #nav-checkbox {
            display: none;
        }

        /* --- Portfolio Section --- */
        .portfolio-header {
            padding: 5rem 5% 2rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .portfolio-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .portfolio-header h1::after {
            content: '';
            display: block;
            width: 50px;
            height: 1px;
            background: var(--accent);
            margin: 1rem auto;
        }

        .portfolio-header p {
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            color: #666;
            text-transform: uppercase;
        }

        /* --- Masonry Gallery --- */
        .gallery-container {
            padding: 2rem 5% 5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .masonry-grid {
            column-count: 3;
            column-gap: 1.5rem;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            background: var(--secondary);
            overflow: hidden;
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            display: block;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            object-fit: cover;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        .gallery-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        /* --- Footer --- */
        footer {
            background: var(--primary);
            color: #fff;
            padding: 4rem 5%;
            text-align: center;
        }

        .footer-logo {
            font-family: var(--heading-font);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .footer-links a {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .copyright {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.4;
        }

        /* --- Responsive --- */
        @media (max-width: 992px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                background: var(--background);
                flex-direction: column;
                align-items: center;
                padding: 2rem 0;
                gap: 1.5rem;
                border-bottom: 1px solid var(--secondary);
                display: none;
            }

            #nav-checkbox:checked ~ .nav-links {
                display: flex;
            }

            .masonry-grid {
                column-count: 1;
            }

            .portfolio-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">LUMIÈRE</div>
            <input type="checkbox" id="nav-checkbox">
            <label for="nav-checkbox" class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <div class="nav-links">
                <a href="home.html">Home</a>
                <a href="portfolio.html" class="active">Gallery</a>
                <a href="services.html">Services</a>
                <a href="our-story.html">Our Story</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="portfolio-header">
            <h1>The Collection</h1>
            <p>A visual catalog of our latest structural cake designs and artisanal finishes.</p>
        </section>

        <section class="gallery-container">
            <div class="masonry-grid">
                <div class="gallery-item">
                    <img src="WhatsApp Image 2026-02-05 at 20.35.13.jpeg" alt="Architectural tiered cake with sharp edges">
                </div>
                <div class="gallery-item">
                    <img src="WhatsApp Image 2026-02-05 at 20.35.13 (2).jpeg" alt="Minimalist cake structure with geometric gold accents">
                </div>
                <div class="gallery-item">
                    <img src="WhatsApp Image 2026-02-05 at 20.35.13 (1).jpeg" alt="Bespoke celebration cake featuring clean lines and textured finish">
                </div>
                <!-- Repeated images to simulate a fuller gallery if needed, based on brief list -->
                <div class="gallery-item">
                    <img src="WhatsApp Image 2026-02-05 at 20.35.13.jpeg" alt="Detail of artisanal frosting technique">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-logo">LUMIÈRE</div>
        <div class="footer-links">
            <a href="#">Instagram</a>
            <a href="#">Pinterest</a>
            <a href="#">Inquiries</a>
        </div>
        <div class="copyright">
            &copy; 2024 Lumière Pâtisserie. Architectural Precision in Every Slice.
        </div>
    </footer>

</body>
</html>
