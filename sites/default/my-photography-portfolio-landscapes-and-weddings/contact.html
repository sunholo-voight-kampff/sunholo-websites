<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="High-impact landscape and wedding photography featuring bold colors and cinematic compositions.">
    <title>Book the Lens | Vivid Lens Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF004D;
            --secondary: #1A1A1A;
            --accent: #00F0FF;
            --bg: #080808;
            --text: #FFFFFF;
            --heading-font: 'Anton', sans-serif;
            --body-font: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--body-font);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: var(--heading-font);
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
        }

        /* Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--primary);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--heading-font);
            font-size: 1.8rem;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--primary);
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: var(--accent);
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: var(--text);
        }

        /* Contact Form Section */
        .contact-hero {
            padding: 8rem 5% 4rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        .contact-info h1 {
            font-size: clamp(4rem, 10vw, 8rem);
            margin-bottom: 2rem;
            color: var(--primary);
            transform: rotate(-2deg);
            display: inline-block;
        }

        .contact-info p {
            font-size: 1.2rem;
            max-width: 400px;
            border-left: 4px solid var(--accent);
            padding-left: 1.5rem;
        }

        .form-container {
            background: var(--secondary);
            padding: 3rem;
            border-right: 8px solid var(--primary);
            position: relative;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 100%;
            height: 100%;
            border: 1px solid var(--accent);
            z-index: -1;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        input, textarea {
            background: #000;
            border: 1px solid #333;
            padding: 1rem;
            color: white;
            font-family: var(--body-font);
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background: var(--primary);
            color: white;
            font-family: var(--heading-font);
            font-size: 1.5rem;
            padding: 1rem;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg);
            transform: translate(5px, -5px);
            box-shadow: -5px 5px 0 var(--primary);
        }

        /* Footer CTA */
        .footer-cta {
            margin-top: 6rem;
            position: relative;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .footer-cta img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.3) saturate(1.5);
            z-index: 1;
        }

        .footer-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
        }

        .footer-content h2 {
            font-size: clamp(3rem, 8vw, 6rem);
            margin-bottom: 1rem;
        }

        .footer-content p {
            font-size: 1.5rem;
            color: var(--accent);
            font-weight: 700;
        }

        footer {
            padding: 2rem 5%;
            text-align: center;
            font-size: 0.8rem;
            background: #000;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .contact-hero {
                grid-template-columns: 1fr;
                padding-top: 4rem;
            }

            .contact-info h1 {
                transform: none;
            }

            .menu-toggle {
                display: flex;
            }

            nav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--secondary);
                flex-direction: column;
                padding: 2rem;
                text-align: center;
                border-bottom: 2px solid var(--primary);
            }

            #nav-check:checked ~ nav {
                display: flex;
            }
        }

        input[type="checkbox"] {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">VIVID<span>LENS</span></a>
        <input type="checkbox" id="nav-check">
        <label for="nav-check" class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <nav>
            <a href="#home">Home</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#services">Experiences</a>
            <a href="#about">The Artist</a>
            <a href="#contact" class="active">Book the Lens</a>
        </nav>
    </header>

    <main>
        <section class="contact-hero">
            <div class="contact-info">
                <h1>Let's Create Magic</h1>
                <p>Ready to make something unforgettable? Drop a line and let's discuss your vision.</p>
            </div>

            <div class="form-container">
                <form action="#">
                    <div class="field-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="field-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="hello@example.com" required>
                    </div>
                    <div class="field-group">
                        <label for="type">Project Type</label>
                        <input type="text" id="type" placeholder="Wedding, Landscape, Adventure...">
                    </div>
                    <div class="field-group">
                        <label for="message">Your Vision</label>
                        <textarea id="message" rows="5" placeholder="Tell us about the electricity you want to capture..." required></textarea>
                    </div>
                    <button type="submit">Ignite the Lens</button>
                </form>
            </div>
        </section>

        <section class="footer-cta">
            <img src="WhatsApp Image 2026-02-05 at 20.33.27.jpeg" alt="Cinematic photography showcase">
            <div class="footer-content">
                <h2>Follow the Journey</h2>
                <p>Join us on social for daily bursts of color.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Vivid Lens | Photography by Design. All rights reserved.</p>
    </footer>

</body>
</html>
