<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A warm and inviting photography portfolio specializing in landscape and wedding photography that captures the tender, rustic beauty of life's most precious moments.">
    <title>Get in Touch | Earth & Heart Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #B08968;
            --secondary: #E6CCB2;
            --accent: #7F5539;
            --background: #EDE0D4;
            --text: #432818;
            --heading-font: 'Playfair Display', serif;
            --body-font: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            font-family: var(--body-font);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: var(--heading-font);
            font-weight: 700;
            color: var(--text);
        }

        header {
            padding: 2rem 1rem;
            text-align: center;
            background-color: var(--background);
            position: relative;
            z-index: 100;
        }

        .logo {
            font-family: var(--heading-font);
            font-size: 2rem;
            text-decoration: none;
            color: var(--text);
            display: block;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .menu-toggle {
            display: none;
        }

        .hamburger {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
            z-index: 110;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: var(--text);
            transition: 0.3s;
        }

        /* Contact Section Styles */
        .contact-container {
            max-width: 1100px;
            margin: 4rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        .contact-info {
            position: sticky;
            top: 2rem;
        }

        .contact-image-wrapper {
            margin-top: 2rem;
            position: relative;
        }

        .contact-image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(67, 40, 24, 0.15);
            display: block;
        }

        .contact-header {
            margin-bottom: 2rem;
        }

        .contact-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .contact-header p {
            font-size: 1.1rem;
            font-style: italic;
            color: var(--accent);
        }

        /* Form Styles */
        .form-card {
            background-color: var(--secondary);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid rgba(176, 137, 104, 0.3);
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.5);
            font-family: var(--body-font);
            color: var(--text);
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 1.2rem 2.5rem;
            border-radius: 50px;
            font-family: var(--body-font);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            width: 100%;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background-color: var(--text);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 4rem 1rem;
            margin-top: 4rem;
            border-top: 1px solid var(--secondary);
        }

        .footer-text {
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .contact-container {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            .contact-info {
                position: static;
                text-align: center;
            }
            .contact-header h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
                position: absolute;
                top: 2.5rem;
                right: 2rem;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: var(--background);
                padding: 2rem 0;
                box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            }

            .menu-toggle:checked ~ .nav-links {
                display: flex;
            }

            .menu-toggle:checked ~ .hamburger span:nth-child(1) {
                transform: translateY(7px) rotate(45deg);
            }
            .menu-toggle:checked ~ .hamburger span:nth-child(2) {
                opacity: 0;
            }
            .menu-toggle:checked ~ .hamburger span:nth-child(3) {
                transform: translateY(-7px) rotate(-45deg);
            }

            .form-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Earth & Heart</a>
        <nav>
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-container">
            <section class="contact-info">
                <div class="contact-header">
                    <h1>Let's Tell Your Story</h1>
                    <p>Inquire about dates, pricing, or just say hello. We can't wait to meet you.</p>
                </div>
                
                <div class="contact-image-wrapper">
                    <img src="WhatsApp Image 2026-02-05 at 20.33.27 (3).jpeg" alt="Soft rustic portrait capturing intimate lighting">
                </div>
            </section>

            <section class="contact-form-section">
                <div class="form-card">
                    <form action="#" method="POST">
                        <input type="text" name="_hp" style="display:none" tabindex="-1" autocomplete="off">
                        
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" placeholder="Your name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="hello@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="service">Interested In</label>
                            <select id="service" name="service">
                                <option value="wedding">Wedding Photography</option>
                                <option value="landscape">Landscape & Prints</option>
                                <option value="family">Family & Portraits</option>
                                <option value="other">Something Else</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="message">Your Story</label>
                            <textarea id="message" name="message" rows="6" placeholder="Tell us about your vision..." required></textarea>
                        </div>

                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p class="footer-text">&copy; 2024 Earth & Heart Photography. Rooted in the earth, inspired by the heart.</p>
    </footer>

<meta name="wb-site" content="earth-heart-photography"><script data-wb-form>

</script></body>
</html>
